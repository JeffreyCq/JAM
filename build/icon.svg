<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: bright blue top → deep navy bottom -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"   stop-color="#2979FF"/>
      <stop offset="100%" stop-color="#0A2472"/>
    </linearGradient>
    <!-- Top gloss -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- HB text gradient: white → very light blue -->
    <linearGradient id="hbgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3F2FD"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect width="1024" height="1024" rx="192" fill="url(#bg)"/>

  <!-- Top gloss overlay -->
  <ellipse cx="512" cy="160" rx="520" ry="220" fill="url(#gloss)"/>

  <!-- Subtle inner border -->
  <rect x="6" y="6" width="1012" height="1012" rx="186" fill="none"
        stroke="white" stroke-opacity="0.08" stroke-width="4"/>

  <!-- HB — main text -->
  <text
    x="512" y="594"
    text-anchor="middle"
    font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif"
    font-weight="900"
    font-size="430"
    fill="url(#hbgrad)"
  >HB</text>

  <!-- Thin separator line -->
  <rect x="180" y="728" width="664" height="2.5" rx="1.5"
        fill="#90CAF9" fill-opacity="0.45"/>

  <!-- ide — subtitle -->
  <text
    x="512" y="848"
    text-anchor="middle"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="118"
    fill="#90CAF9"
    letter-spacing="28"
  >ide</text>
</svg>
