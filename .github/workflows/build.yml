name: Build Installers

# Trigger manually from GitHub UI, or automatically on version tags (v1.0.1, etc.)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ── macOS ────────────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (mac)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # skip code signing (no Apple cert)

      - name: Upload .dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 30

  # ── Windows ──────────────────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (windows)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installers
          path: |
            release/*.exe
          retention-days: 30

  # ── Create GitHub Release (only on version tags) ──────────────────────────────
  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
