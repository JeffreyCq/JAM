name: Build Installers

# Trigger manually from GitHub UI, or automatically on version tags (v1.0.1, etc.)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# macOS builds are NOT produced here on purpose: they're signed locally with a
# self-signed "JAM Internal Code Signing" certificate that only lives in one
# machine's keychain (see build.mac.identity in package.json and
# scripts/after-pack.js). A CI runner has no access to that certificate, so a
# CI-built .dmg would only ever be ad-hoc-signed — worse than, and liable to
# silently overwrite via `gh release upload`, the properly signed one. Build
# and upload macOS artifacts locally (`npm run dist:mac`, then
# `gh release upload <tag> release/*.dmg release/*.zip --clobber`).
jobs:
  # ── Windows ──────────────────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (windows)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installers
          path: |
            release/*.exe
          retention-days: 30

  # ── Create GitHub Release (only on version tags) ──────────────────────────────
  # Windows-only for now — see the note above about macOS artifacts.
  release:
    needs: [build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
